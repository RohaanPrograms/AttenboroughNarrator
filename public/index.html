<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attenborough Mode</title>
  <style>
    /* Phase 1: ugly-but-complete. Real cinematic polish comes in Phase 3. */
    body { margin: 0; background: #111; color: #eee; font-family: Georgia, serif; }
    #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    #cam { width: 100%; height: 100%; object-fit: cover; }
    #caption {
      position: absolute; left: 0; right: 0; bottom: 8%;
      text-align: center; font-size: 1.6rem; line-height: 1.4;
      padding: 0 8%; text-shadow: 0 2px 6px #000;
    }
    #controls {
      position: absolute; top: 16px; left: 16px; display: flex; gap: 12px; align-items: center;
      font-family: system-ui, sans-serif;
    }
    button {
      font-size: 1rem; padding: 10px 18px; border: 0; border-radius: 8px;
      background: #e0b055; color: #111; cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: .85rem; color: #aaa; }
    .live { color: #ff5252; font-weight: 700; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <div id="caption"></div>
    <div id="controls">
      <button id="startBtn">▶ Start Documentary</button>
      <button id="stopBtn" disabled>■ Stop</button>
      <span id="status">idle</span>
    </div>
  </div>
  <canvas id="grab" style="display:none"></canvas>

  <script>
    const API = location.origin + '/narrate';   // same-origin: Flask serves this page
    // 6s = snappier pacing. The MAX_QUEUE guard keeps it from racing ahead
    // of the voice, and each frame is still one Gemini + one ElevenLabs call.
    const INTERVAL_MS = 6000;

    const video   = document.getElementById('cam');
    const canvas  = document.getElementById('grab');
    const caption = document.getElementById('caption');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');

    let timer = null;
    const TTS_URL = location.origin + '/tts';

    // --- Producer/consumer queue -------------------------------------------
    // The timer PRODUCES narrations (fetch text + audio) and pushes them here;
    // the player CONSUMES them one at a time, so lines always play in order
    // and are never cut off. Each item: { url: string|null, text: string }.
    const queue = [];
    let fetching = false;      // a /narrate request is currently in flight
    let playing = false;       // the player loop is running
    let currentAudio = null;   // active <audio>, so stop() can halt it
    const MAX_QUEUE = 2;       // don't run more than this far ahead of speech

    // Play an MP3 URL to completion. Resolves only when the clip ENDS —
    // this is what guarantees a narration is never cut off mid-sentence.
    function playAudio(url) {
      return new Promise((resolve) => {
        const a = new Audio(url);
        currentAudio = a;
        const done = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
        a.onended = done;
        a.onerror = done;
        a.play().catch(done);
      });
    }

    // Speak via the browser voice to completion (fallback path, used when no
    // ElevenLabs key is set). Chrome silently truncates any utterance longer
    // than ~15s; the pause/resume keep-alive below prevents that cut-off.
    function playBrowser(text) {
      return new Promise((resolve) => {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.88; u.pitch = 0.75;   // slow + low = documentary gravitas
        const v = pickVoice();
        if (v) u.voice = v;
        const keepAlive = setInterval(() => {
          speechSynthesis.pause();
          speechSynthesis.resume();
        }, 10000);
        const done = () => { clearInterval(keepAlive); resolve(); };
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
      });
    }

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await video.play();
    }

    // Draw the current video frame to a hidden canvas and return base64 JPEG (no data: prefix).
    function grabFrame() {
      const w = 640, h = 480;
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    }

    // PRODUCER: grab a frame, get a narration + its audio, push to the queue.
    async function tick() {
      // Don't stack requests, and don't race too far ahead of what's spoken.
      if (fetching || queue.length >= MAX_QUEUE) return;
      fetching = true;
      statusEl.innerHTML = '<span class="live">● LIVE</span> observing…';
      try {
        const image = grabFrame();
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image })
        });
        const { narration } = await res.json();
        const url = await getAudioUrl(narration);   // null => browser voice
        queue.push({ url, text: narration });
        drainQueue();                                 // start playing if idle
      } catch (e) {
        console.error('narrate failed', e);
        statusEl.textContent = 'network error — retrying next tick';
      } finally {
        fetching = false;
      }
    }

    // CONSUMER: play queued narrations one at a time, in order, never cutting.
    async function drainQueue() {
      if (playing) return;
      playing = true;
      while (queue.length) {
        const item = queue.shift();
        caption.textContent = item.text;           // caption in sync with audio
        if (item.url) await playAudio(item.url);
        else await playBrowser(item.text);
      }
      playing = false;
    }

    // Pick the most Attenborough-ish browser voice available. Real upgrade
    // (ElevenLabs British voice) lands in Phase 2 — this just makes the
    // placeholder as good as the OS allows.
    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      // Preferred named British male voices, best first.
      const preferred = [
        /Daniel/i, /Google UK English Male/i, /George/i, /Arthur/i, /Ryan/i,
      ];
      for (const re of preferred) {
        const v = voices.find(v => re.test(v.name));
        if (v) return v;
      }
      return voices.find(v => /en-GB/i.test(v.lang)) || null;  // any British
    }

    // Fetch the ElevenLabs MP3 for a line and return an object URL to play
    // later. Returns null if TTS is unavailable, so the player uses the
    // browser voice instead. (Fetching here, playing in the queue, keeps
    // audio ready before its turn — no gap between lines.)
    async function getAudioUrl(text) {
      try {
        const res = await fetch(TTS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (res.ok && (res.headers.get('content-type') || '').includes('audio')) {
          const blob = await res.blob();
          return URL.createObjectURL(blob);
        }
      } catch (e) {
        console.warn('ElevenLabs TTS unavailable, using browser voice', e);
      }
      return null;
    }

    async function start() {
      startBtn.disabled = true;
      try {
        await initCamera();
      } catch (e) {
        alert('Camera access is required. Please allow it and try again.');
        startBtn.disabled = false;
        return;
      }
      stopBtn.disabled = false;
      tick();                          // fire immediately, then on an interval
      timer = setInterval(tick, INTERVAL_MS);
    }

    function stop() {
      if (timer) clearInterval(timer);
      timer = null;
      speechSynthesis.cancel();
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      queue.length = 0;      // drop anything waiting to be spoken
      playing = false;
      fetching = false;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      statusEl.textContent = 'stopped';
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);

    // Voices load asynchronously in some browsers; nudge them to populate.
    speechSynthesis.onvoiceschanged = () => {};
  </script>
</body>
</html>
