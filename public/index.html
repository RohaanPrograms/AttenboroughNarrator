<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attenborough Mode</title>
  <style>
    :root {
      --gold: #e0b055;
      --bar: 12vh;              /* letterbox bar height */
      --serif: Georgia, 'Times New Roman', 'Playfair Display', serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f4f1ea; font-family: var(--serif); }
    #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }

    /* Webcam fills the frame between the letterbox bars. */
    #cam {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; filter: saturate(1.05) contrast(1.03);
    }
    /* Subtle cinematic vignette. */
    #stage::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 220px 40px rgba(0,0,0,.65);
    }

    /* Letterbox bars (top/bottom black cinema bars). */
    .letterbox { position: absolute; left: 0; right: 0; height: var(--bar);
      background: #000; z-index: 3; pointer-events: none; }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    /* REC / LIVE indicator (top-left, inside the top bar). */
    #rec {
      position: absolute; top: calc(var(--bar) / 2); left: 4vw; transform: translateY(-50%);
      z-index: 5; display: none; align-items: center; gap: 10px;
      font-family: system-ui, sans-serif; letter-spacing: .18em; font-size: .8rem;
      color: #f4f1ea; text-transform: uppercase;
    }
    #rec .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff3b30;
      box-shadow: 0 0 10px #ff3b30; animation: pulse 1.6s infinite ease-in-out; }
    #rec.narrating .dot { animation-duration: .7s; }   /* faster pulse while speaking */
    #rec .sub { color: #b9b2a4; letter-spacing: .12em; font-size: .72rem; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); }
                       50% { opacity: .35; transform: scale(.8); } }

    /* Stop control (top-right, appears while running). */
    #stopBtn {
      position: absolute; top: calc(var(--bar) / 2); right: 4vw; transform: translateY(-50%);
      z-index: 5; display: none; font-family: system-ui, sans-serif;
      background: rgba(255,255,255,.12); color: #f4f1ea; border: 1px solid rgba(255,255,255,.3);
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: .85rem;
    }
    #stopBtn:hover { background: rgba(255,255,255,.22); }

    /* Subtitle bar — BBC-style, serif, fades in/out, sits above the bottom bar. */
    #subtitle {
      position: absolute; left: 0; right: 0; bottom: calc(var(--bar) + 3.5vh);
      z-index: 5; text-align: center; padding: 0 10vw;
      font-size: clamp(1.2rem, 2.6vw, 2.1rem); line-height: 1.45; font-style: italic;
      text-shadow: 0 2px 12px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8);
      opacity: 0; transition: opacity .5s ease; will-change: opacity;
    }
    #subtitle.show { opacity: 1; }

    /* Title card overlay. */
    #titlecard {
      position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 26px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.9));
      transition: opacity .8s ease; padding: 8vh 6vw;
    }
    #titlecard.hidden { opacity: 0; pointer-events: none; }
    #titlecard .kicker { font-family: system-ui, sans-serif; letter-spacing: .4em;
      text-transform: uppercase; font-size: .8rem; color: var(--gold); }
    #titlecard h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5rem); font-weight: 600;
      letter-spacing: .01em; }
    #titlecard .tagline { margin: 0; font-style: italic; color: #cfc8ba;
      font-size: clamp(1rem, 2.4vw, 1.4rem); max-width: 40ch; }
    #startBtn {
      margin-top: 8px; font-family: system-ui, sans-serif; font-weight: 700;
      font-size: 1.05rem; letter-spacing: .04em; padding: 15px 34px; border: 0;
      border-radius: 999px; background: var(--gold); color: #1a1206; cursor: pointer;
      box-shadow: 0 8px 30px rgba(224,176,85,.35); transition: transform .15s ease, box-shadow .15s ease;
    }
    #startBtn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(224,176,85,.5); }
    #startBtn:disabled { opacity: .6; cursor: default; transform: none; }
    #hint { font-family: system-ui, sans-serif; font-size: .8rem; color: #8b857a; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>

    <div id="rec">
      <span class="dot"></span>
      <span>Live</span>
      <span class="sub" id="status"></span>
    </div>
    <button id="stopBtn">■ Stop</button>

    <div id="subtitle"></div>

    <div id="titlecard">
      <div class="kicker">A Nature Documentary</div>
      <h1>Attenborough Mode</h1>
      <p class="tagline">Rare footage of the modern developer in its natural habitat, narrated as it truly deserves.</p>
      <button id="startBtn">▶ Start Documentary</button>
      <div id="hint">Best with sound on. Camera access required.</div>
    </div>
  </div>

  <canvas id="grab" style="display:none"></canvas>

  <script>
    const API = location.origin + '/narrate';   // same-origin: Flask serves this page
    // 6s = snappier pacing. The MAX_QUEUE guard keeps it from racing ahead
    // of the voice, and each frame is one Gemini narration + one Gemini TTS call.
    const INTERVAL_MS = 6000;

    const video    = document.getElementById('cam');
    const canvas   = document.getElementById('grab');
    const subtitle = document.getElementById('subtitle');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const rec       = document.getElementById('rec');
    const titlecard = document.getElementById('titlecard');

    let timer = null;
    const TTS_URL = location.origin + '/tts';

    // --- Producer/consumer queue -------------------------------------------
    // The timer PRODUCES narrations (fetch text + audio) and pushes them here;
    // the player CONSUMES them one at a time, so lines always play in order
    // and are never cut off. Each item: { url: string|null, text: string }.
    const queue = [];
    let running = false;       // true between Start and Stop; every async step checks it
    let fetching = false;      // a /narrate request is currently in flight
    let playing = false;       // the player loop is running
    let currentAudio = null;   // active <audio>, so stop() can halt it
    let currentDone = null;    // resolver for the clip being awaited, so stop() unblocks it
    const MAX_QUEUE = 2;       // don't run more than this far ahead of speech

    // Fade the subtitle out, swap text, fade back in — BBC-style.
    function showCaption(text) {
      subtitle.classList.remove('show');
      setTimeout(() => { subtitle.textContent = text; subtitle.classList.add('show'); }, 180);
    }

    // Play an audio URL to completion. Resolves only when the clip ENDS —
    // this is what guarantees a narration is never cut off mid-sentence.
    function playAudio(url) {
      return new Promise((resolve) => {
        const a = new Audio(url);
        currentAudio = a;
        const done = () => {
          URL.revokeObjectURL(url);
          if (currentAudio === a) currentAudio = null;
          currentDone = null;
          resolve();
        };
        currentDone = done;   // lets stop() resolve this immediately
        a.onended = done;
        a.onerror = done;
        a.play().catch(done);
      });
    }

    // Speak via the browser voice to completion (fallback path, used only if
    // Gemini TTS errors). Chrome silently truncates any utterance longer than
    // ~15s; the pause/resume keep-alive below prevents that cut-off.
    function playBrowser(text) {
      return new Promise((resolve) => {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.88; u.pitch = 0.75;   // slow + low = documentary gravitas
        const v = pickVoice();
        if (v) u.voice = v;
        const keepAlive = setInterval(() => {
          speechSynthesis.pause();
          speechSynthesis.resume();
        }, 10000);
        const done = () => { clearInterval(keepAlive); resolve(); };
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
      });
    }

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await video.play();
    }

    // Draw the current video frame to a hidden canvas and return base64 JPEG (no data: prefix).
    function grabFrame() {
      const w = 640, h = 480;
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    }

    // PRODUCER: grab a frame, get a narration + its audio, push to the queue.
    async function tick() {
      // Don't stack requests, and don't race too far ahead of what's spoken.
      if (!running || fetching || queue.length >= MAX_QUEUE) return;
      fetching = true;
      try {
        const image = grabFrame();
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image })
        });
        if (!running) return;                         // stopped mid-request — drop it
        const { narration } = await res.json();
        const url = await getAudioUrl(narration);     // null => browser voice
        if (!running) return;                         // stopped during TTS — drop it
        queue.push({ url, text: narration });
        drainQueue();                                 // start playing if idle
      } catch (e) {
        console.error('narrate failed', e);
        if (running) statusEl.textContent = 'reconnecting…';
      } finally {
        fetching = false;
      }
    }

    // CONSUMER: play queued narrations one at a time, in order, never cutting.
    async function drainQueue() {
      if (playing || !running) return;
      playing = true;
      rec.classList.add('narrating');
      while (running && queue.length) {
        const item = queue.shift();
        showCaption(item.text);                     // caption in sync with audio
        statusEl.textContent = 'narrating…';
        if (item.url) await playAudio(item.url);
        else await playBrowser(item.text);
      }
      rec.classList.remove('narrating');
      if (running) statusEl.textContent = 'observing…';
      playing = false;
    }

    // Pick the most Attenborough-ish browser voice available (fallback path).
    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      const preferred = [
        /Daniel/i, /Google UK English Male/i, /George/i, /Arthur/i, /Ryan/i,
      ];
      for (const re of preferred) {
        const v = voices.find(v => re.test(v.name));
        if (v) return v;
      }
      return voices.find(v => /en-GB/i.test(v.lang)) || null;  // any British
    }

    // Fetch the Gemini TTS audio (WAV) for a line and return an object URL to
    // play later. Returns null if TTS errors, so the player uses the browser
    // voice instead. (Fetching here, playing in the queue, keeps audio ready
    // before its turn — no gap between lines.)
    async function getAudioUrl(text) {
      try {
        const res = await fetch(TTS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (res.ok && (res.headers.get('content-type') || '').includes('audio')) {
          const blob = await res.blob();
          return URL.createObjectURL(blob);
        }
      } catch (e) {
        console.warn('Gemini TTS unavailable, using browser voice', e);
      }
      return null;
    }

    async function start() {
      startBtn.disabled = true;
      try {
        await initCamera();
      } catch (e) {
        alert('Camera access is required. Please allow it and try again.');
        startBtn.disabled = false;
        return;
      }
      running = true;
      titlecard.classList.add('hidden');
      rec.style.display = 'flex';
      stopBtn.style.display = 'block';
      statusEl.textContent = 'observing…';
      tick();                          // fire immediately, then on an interval
      timer = setInterval(tick, INTERVAL_MS);
    }

    function stop() {
      running = false;       // every in-flight async step bails on this
      if (timer) clearInterval(timer);
      timer = null;
      speechSynthesis.cancel();
      if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
      if (currentDone) { const d = currentDone; currentDone = null; d(); }  // unblock the awaiter
      queue.length = 0;      // drop anything waiting to be spoken
      playing = false;
      fetching = false;
      rec.style.display = 'none';
      rec.classList.remove('narrating');
      stopBtn.style.display = 'none';
      subtitle.classList.remove('show');
      titlecard.classList.remove('hidden');
      startBtn.disabled = false;
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);

    // Voices load asynchronously in some browsers; nudge them to populate.
    speechSynthesis.onvoiceschanged = () => {};
  </script>
</body>
</html>
